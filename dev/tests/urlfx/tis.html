<html><head><meta http-equiv="Content-Type" content="text/html; charset=tis-620"><title>ประกาศโรงเรียน</title></head><body>
<table><tr><td>เมนู</td><td><div class="content"><p>โรงเรียนจะปิดทำการในวันจันทร์ที่สิบเจ็ดเนื่องในวันหยุดราชการ นักเรียนทุกคนกลับมาเรียนตามปกติในวันอังคาร</p>
<p>ผู้ปกครองที่มีข้อสงสัยสามารถติดต่อฝ่ายวิชาการได้ในเวลาราชการ ขอบคุณที่ให้ความร่วมมือ</p></div></td></tr></table></body></html>
